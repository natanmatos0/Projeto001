<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            background-color: rgb(192, 192, 192);
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #3498db;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            height: 60px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        header nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        section {
            background: rgba(190, 190, 168, 0.745);
            border-radius: 10px;
            padding: 30px;
            width: 400px;
            margin: 120px auto 0 auto;
            box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.34);
        }

        h1 {
            margin-bottom: 20px;
            text-align: start;
            
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center; /* mantém os inputs e botão centralizados */
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* texto à esquerda */
            margin-bottom: 15px;
        }

        .input-group p {
            margin: 0 0 5px 0;
            font-size: 16px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%; /* ocupa toda a largura do grupo */
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            background-color: #b31f1f;
            color: white;
            border: 2px solid #000000;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        button:hover {
            background-color: #4b0208;
            border-color: #2e7d3200;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="index.html">Voltar para área inicial</a>
        </nav>
    </header>

   <section>
    <div id="logDiv" class="container">
        <h1>Faça seu login</h1>

        <div class="input-group">
            <p>E-mail:</p>
            <input type="email" placeholder="exemplo@gmail.com" id="email">
        </div>

        <div class="input-group">
            <p>Senha:</p>
            <input type="password" placeholder="123@nN45" id="senha">
        </div>

        <button onclick="logar()">ENTRAR</button>

        
        Não tem uma conta?<a href="cadastroDeUsuarios.html" target="_blank" class="link-abaixo">Cadastre-se</a>
    </div>
</section>

    <script src="index.js"></script>
</body>

</html>
